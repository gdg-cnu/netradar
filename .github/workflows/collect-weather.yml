# 기상청 시간별 강수 수집 (매시 50분, 초단기실황 최근 3시간 + 초단기예보 6시간)
# 필요한 Secrets: SUPABASE_URL, SUPABASE_SECRET_KEY, DATA_GO_KR_KEY
#   (DATA_GO_KR_KEY 계정에 '기상청_단기예보 조회서비스' 활용신청이 승인돼 있어야 한다)
# 50분에 도는 이유: 실황은 매시 40분, 예보는 매시 45분 이후에 올라온다
name: Collect weather

on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:

concurrency:
  group: collect-weather
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/collectors/requirements.txt
      - run: pip install -r collectors/requirements.txt
      - run: python -m collectors.weather
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
