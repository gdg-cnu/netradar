name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  frontend:
    name: Frontend (typecheck · test · format · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: front/.nvmrc
      - run: npm install -g npm@12.2.3
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build

  e2e:
    name: E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: v1
            script: test:e2e
          - suite: live
            script: test:e2e:live
          - suite: v2
            script: test:e2e:v2
          - suite: server-v2
            script: test:e2e:v2:server
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.suite == 'server-v2'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install server V2 API dependencies
        if: matrix.suite == 'server-v2'
        run: python -m pip install -r ../backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: front/.nvmrc
      - run: npm install -g npm@12.2.3
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ${{ matrix.script }}
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.suite }}
          path: |
            front/test-results/
            front/.cache/test-results-*/
          retention-days: 7
