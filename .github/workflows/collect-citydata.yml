# 서울 실시간 도시데이터 인구 수집 (10분마다)
# 필요한 Secrets: SUPABASE_URL, SUPABASE_SECRET_KEY, SEOUL_API_KEY
# 예약 실행은 기본 브랜치(main)의 이 파일로만 돈다. GitHub 사정으로 몇 분씩 늦거나 건너뛸 수 있다
name: Collect citydata

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: collect-citydata
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/collectors/requirements.txt
      - run: pip install -r collectors/requirements.txt
      - run: python -m collectors.citydata
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
