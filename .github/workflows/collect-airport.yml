# 인천공항 승객예고 수집 (매시 5분, 오늘·내일 2일치)
# 필요한 Secrets: SUPABASE_URL, SUPABASE_SECRET_KEY, DATA_GO_KR_KEY
name: Collect airport

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

concurrency:
  group: collect-airport
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/collectors/requirements.txt
      - run: pip install -r collectors/requirements.txt
      - run: python -m collectors.airport
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
