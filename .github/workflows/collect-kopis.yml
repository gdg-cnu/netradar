# KOPIS 공연 정보 수집 (매일 06:00 KST = 21:00 UTC, 오늘부터 7일치)
# 필요한 Secrets: SUPABASE_URL, SUPABASE_SECRET_KEY, KOPIS_API_KEY
name: Collect KOPIS

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: collect-kopis
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # 공연 상세를 한 건씩 받아서(수백~천여 건) 오래 걸릴 수 있다
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/collectors/requirements.txt
      - run: pip install -r collectors/requirements.txt
      - run: python -m collectors.kopis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
